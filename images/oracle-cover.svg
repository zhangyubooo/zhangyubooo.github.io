<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600"
     role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">World Oracle</title>
  <desc id="d">Hexagram 61, Zhong Fu. Six horizontal bars grow outward from the centre one at a
    time, from the bottom of the figure upward, the way a hexagram is cast. A thread then ties the
    finished figure to the top of the frame and it sways gently before clearing and casting again.</desc>

  <style>
    /* ------------------------------------------------------------------
       Two motions, and the order they happen in is the point:

         cast   — six bars grow out from the centre, bottom to top, which
                  is the direction a hexagram is built in
         hang   — the finished figure is tied off at the top edge and
                  drifts, because 卦 and 挂 are the same sound and, in the
                  older sense, the same idea: something hung up to be read

       The bars arrive 700ms apart. That is not a number picked to look
       right — it is `lineDelay` out of oracle.js, the interval the real
       page builds a cast at. The cover runs the product's own heartbeat.

       The two animations sit on two nested groups because they both drive
       `transform` and would otherwise overwrite each other. They also run
       at different lengths (10s and 11s) so they never lock into a visible
       pattern.
       ------------------------------------------------------------------ */

    .grow {                       /* the cast: opacity + scaleX */
      transform-box: fill-box;
      transform-origin: center;
      animation: 10s ease-out infinite;   /* ease-out on the growth; the
                                             held segments have nothing to ease */
    }
    .bar {                        /* the hang: drift + a touch of tilt */
      transform-box: fill-box;
      transform-origin: center;
      animation: sway 11s ease-in-out infinite;
    }

    /* One keyframe set per line rather than one set plus six delays: a delay
       would offset each bar's whole cycle, so they would stop clearing and
       rebuilding together. The stagger has to live inside the timeline. */
    .l1 .grow { animation-name: cast1; }   /* bottom — first */
    .l2 .grow { animation-name: cast2; }
    .l3 .grow { animation-name: cast3; }
    .l4 .grow { animation-name: cast4; }
    .l5 .grow { animation-name: cast5; }
    .l6 .grow { animation-name: cast6; }   /* top — last */

    /* 0.06 rather than 0: a bar scaled to nothing has no width to grow from,
       and the first frame of the growth reads as a hard pop. */
    @keyframes cast1 {
      0%              { opacity: 0; transform: scaleX(0.06); }
      5.5%, 80%       { opacity: 1; transform: scaleX(1); }
      88%, 100%       { opacity: 0; transform: scaleX(0.06); }
    }
    @keyframes cast2 {
      0%, 7%          { opacity: 0; transform: scaleX(0.06); }
      12.5%, 80%      { opacity: 1; transform: scaleX(1); }
      88%, 100%       { opacity: 0; transform: scaleX(0.06); }
    }
    @keyframes cast3 {
      0%, 14%         { opacity: 0; transform: scaleX(0.06); }
      19.5%, 80%      { opacity: 1; transform: scaleX(1); }
      88%, 100%       { opacity: 0; transform: scaleX(0.06); }
    }
    @keyframes cast4 {
      0%, 21%         { opacity: 0; transform: scaleX(0.06); }
      26.5%, 80%      { opacity: 1; transform: scaleX(1); }
      88%, 100%       { opacity: 0; transform: scaleX(0.06); }
    }
    @keyframes cast5 {
      0%, 28%         { opacity: 0; transform: scaleX(0.06); }
      33.5%, 80%      { opacity: 1; transform: scaleX(1); }
      88%, 100%       { opacity: 0; transform: scaleX(0.06); }
    }
    @keyframes cast6 {
      0%, 35%         { opacity: 0; transform: scaleX(0.06); }
      40.5%, 80%      { opacity: 1; transform: scaleX(1); }
      88%, 100%       { opacity: 0; transform: scaleX(0.06); }
    }

    /* The thread arrives with the top bar — the moment the finished figure
       gets hung up. Before that there is nothing yet to hang. */
    .thread {
      transform-box: view-box;
      transform-origin: 450px 0px;
      animation: knot 11s ease-in-out infinite, tie 10s linear infinite;
    }
    @keyframes tie {
      0%, 35%    { opacity: 0; }
      40.5%, 80% { opacity: 1; }
      88%, 100%  { opacity: 0; }
    }

    /* Drift grows downward: the further from the knot, the wider the arc.
       Tilt stays tiny and equal — its only job is to keep the motion from
       reading as a flat sideways slide. A first version got both out of one
       rotation about a distant pivot, which is what a pendulum really does,
       but it welded them together: enough drift to see came with enough tilt
       to make the hexagram look crooked. */
    @keyframes sway {
      0%, 100% { transform: translateX(calc(-1 * var(--amp))) rotate(-0.28deg); }
      50%      { transform: translateX(var(--amp))            rotate( 0.28deg); }
    }
    @keyframes knot {
      0%, 100% { transform: rotate(-1.02deg); }   /* atan(3/169) — carries the */
      50%      { transform: rotate( 1.02deg); }   /* thread's end to bar 6      */
    }

    .l6 { --amp: 3px; }  .l6 .bar { animation-delay: -0.0s; }
    .l5 { --amp: 4px; }  .l5 .bar { animation-delay: -0.4s; }
    .l4 { --amp: 5px; }  .l4 .bar { animation-delay: -0.8s; }
    .l3 { --amp: 6px; }  .l3 .bar { animation-delay: -1.2s; }
    .l2 { --amp: 7px; }  .l2 .bar { animation-delay: -1.6s; }
    .l1 { --amp: 8px; }  .l1 .bar { animation-delay: -2.0s; }

    /* The two halves of a broken line are two hanging things, not one thing
       with a hole in it, so the right half trails and the gap breathes. */
    .l5 .half-r .bar { animation-delay: -0.6s; }
    .l4 .half-r .bar { animation-delay: -1.0s; }
    .l3 .half-r .bar { animation-delay: -1.4s; }
    .l2 .half-r .bar { animation-delay: -1.8s; }
    .l1 .half-r .bar { animation-delay: -2.2s; }

    /* Anyone who has asked their system for less motion gets the finished
       figure, hung and still. */
    @media (prefers-reduced-motion: reduce) {
      .grow, .bar, .thread { animation: none; }
    }
  </style>

  <rect width="900" height="600" fill="#ffffff"/>

  <g class="thread">
    <rect x="449.6" y="0" width="0.8" height="170" fill="#e5e5e5"/>
  </g>

  <g fill="#111111">
    <!-- Hexagram 61 中孚 · solid, solid, broken, broken, solid, solid.
         Drawn top to bottom; the classes count bottom to top, because that is
         how the lines of a hexagram are numbered and cast. -->

    <g class="l6"><g class="grow"><g class="bar"><rect x="250" y="169" width="400" height="22"/></g></g></g>
    <g class="l5"><g class="grow"><g class="bar"><rect x="250" y="217" width="400" height="22"/></g></g></g>

    <g class="l4">
      <g class="grow"><g class="bar"><rect x="250" y="265" width="178" height="22"/></g></g>
      <g class="half-r"><g class="grow"><g class="bar"><rect x="472" y="265" width="178" height="22"/></g></g></g>
    </g>

    <g class="l3">
      <g class="grow"><g class="bar"><rect x="250" y="313" width="178" height="22"/></g></g>
      <g class="half-r"><g class="grow"><g class="bar"><rect x="472" y="313" width="178" height="22"/></g></g></g>
    </g>

    <g class="l2"><g class="grow"><g class="bar"><rect x="250" y="361" width="400" height="22"/></g></g></g>
    <g class="l1"><g class="grow"><g class="bar"><rect x="250" y="409" width="400" height="22"/></g></g></g>
  </g>
</svg>
