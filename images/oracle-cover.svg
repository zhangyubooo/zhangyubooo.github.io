<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600"
     role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">World Oracle</title>
  <desc id="d">Hexagram 61, Zhong Fu — six horizontal bars hanging from a thread at the top of
    the frame, drifting slowly from side to side, the lower ones travelling further and lagging
    behind the ones above them.</desc>

  <style>
    /* ------------------------------------------------------------------
       The figure hangs. 卦 and 挂 are the same sound, and in the older
       sense the same idea — something suspended, hung up to be read.

       Two things make a hanging object read as hanging: it DRIFTS, and it
       TILTS. A first version got both at once by rotating every bar about
       a single far-away pivot, which is what a pendulum really does — but
       it welds the two together. Enough drift to notice came with enough
       tilt to make the hexagram look crooked, and a hexagram that looks
       crooked just looks badly drawn.

       So they are separated. Drift is generous and grows downward, the way
       it does on a mobile. Tilt is almost nothing, the same for every bar,
       and its only job is to stop the motion reading as a horizontal slide.
       ------------------------------------------------------------------ */

    .bar {
      transform-box: fill-box;
      transform-origin: center;
      animation: sway 11s ease-in-out infinite;
    }

    /* The settle owns translateY, the sway owns translateX and rotate — two
       animations on one element would fight over `transform`, so they live on
       two nested groups. */
    .hang {
      transform-box: fill-box;
      animation: settle 0.9s cubic-bezier(0.22, 1.2, 0.36, 1) both;
    }

    @keyframes sway {
      0%, 100% { transform: translateX(calc(-1 * var(--amp))) rotate(calc(-1 * var(--tilt, 0.28deg))); }
      50%      { transform: translateX(var(--amp))            rotate(var(--tilt, 0.28deg)); }
    }

    @keyframes settle {
      from { transform: translateY(-16px); opacity: 0; }
      to   { transform: translateY(0);     opacity: 1; }
    }

    /* Drift grows downward: the further a thing hangs from the knot, the
       wider the arc it travels. The delays are negative so every bar is
       already mid-swing on the first frame, each at a different point —
       nothing waits its turn and nothing starts in unison. The settle
       delays run the other way, bottom bar first, because that is the
       order a hexagram is cast in. */
    .l6 { --amp: 3px; }   .l6 .bar { animation-delay: -0.0s; }  .l6 .hang { animation-delay: 0.50s; }
    .l5 { --amp: 4px; }   .l5 .bar { animation-delay: -0.4s; }  .l5 .hang { animation-delay: 0.40s; }
    .l4 { --amp: 5px; }   .l4 .bar { animation-delay: -0.8s; }  .l4 .hang { animation-delay: 0.30s; }
    .l3 { --amp: 6px; }   .l3 .bar { animation-delay: -1.2s; }  .l3 .hang { animation-delay: 0.20s; }
    .l2 { --amp: 7px; }   .l2 .bar { animation-delay: -1.6s; }  .l2 .hang { animation-delay: 0.10s; }
    .l1 { --amp: 8px; }   .l1 .bar { animation-delay: -2.0s; }  .l1 .hang { animation-delay: 0.00s; }

    /* The two halves of a broken line are two hanging things, not one thing
       with a hole in it. The right half trails the left by a fraction, so the
       gap between them opens and closes very slightly. */
    .half-r .bar { animation-delay: -0.2s; }
    .l5 .half-r .bar { animation-delay: -0.6s; }
    .l4 .half-r .bar { animation-delay: -1.0s; }
    .l3 .half-r .bar { animation-delay: -1.4s; }
    .l2 .half-r .bar { animation-delay: -1.8s; }
    .l1 .half-r .bar { animation-delay: -2.2s; }

    /* The thread is tied at the top edge, so it cannot drift — it pivots at
       the knot instead, through exactly the angle that carries its lower end
       to where the first bar has drifted to: atan(3 / 169) ≈ 1.02°. That is
       the whole reason the thread and the bar never come apart. */
    .thread {
      transform-box: view-box;
      transform-origin: 450px 0px;
      animation: knot 11s ease-in-out infinite;
    }
    @keyframes knot {
      0%, 100% { transform: rotate(-1.02deg); }
      50%      { transform: rotate( 1.02deg); }
    }

    /* Anyone who has asked their system for less motion gets the figure hung
       and still. */
    @media (prefers-reduced-motion: reduce) {
      .bar, .hang, .thread { animation: none; }
    }
  </style>

  <rect width="900" height="600" fill="#ffffff"/>

  <!-- The thread, from the top edge down to the first bar. -->
  <g class="thread">
    <rect x="449.6" y="0" width="0.8" height="170" fill="#e5e5e5"/>
  </g>

  <g fill="#111111">
    <!-- Hexagram 61 中孚 · solid, solid, broken, broken, solid, solid.
         Drawn top to bottom; the classes count the other way, because the
         lines of a hexagram are numbered from the bottom up. -->

    <g class="l6"><g class="hang"><g class="bar"><rect x="250" y="169" width="400" height="22"/></g></g></g>
    <g class="l5"><g class="hang"><g class="bar"><rect x="250" y="217" width="400" height="22"/></g></g></g>

    <g class="l4">
      <g class="hang"><g class="bar"><rect x="250" y="265" width="178" height="22"/></g></g>
      <g class="half-r"><g class="hang"><g class="bar"><rect x="472" y="265" width="178" height="22"/></g></g></g>
    </g>

    <g class="l3">
      <g class="hang"><g class="bar"><rect x="250" y="313" width="178" height="22"/></g></g>
      <g class="half-r"><g class="hang"><g class="bar"><rect x="472" y="313" width="178" height="22"/></g></g></g>
    </g>

    <g class="l2"><g class="hang"><g class="bar"><rect x="250" y="361" width="400" height="22"/></g></g></g>
    <g class="l1"><g class="hang"><g class="bar"><rect x="250" y="409" width="400" height="22"/></g></g></g>
  </g>
</svg>
